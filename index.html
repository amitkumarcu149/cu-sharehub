<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CU ShareHub - P2P Campus Resource Sharing</title>
  
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 1. Firebase Compat SDKs (Browser friendly) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-6">

  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
    <h1 class="text-2xl font-bold text-indigo-600 mb-4 text-center">CU ShareHub 🎸📚</h1>
    
    <!-- Item Listing Form -->
    <form id="itemForm" class="space-y-4 mb-8">
      <div>
        <label class="block text-sm font-medium text-gray-700">Item Name (e.g., Guitar, Calc)</label>
        <input type="text" id="itemName" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2 focus:ring-indigo-500 focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Category</label>
        <select id="itemCategory" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
          <option value="Instrument">Instrument</option>
          <option value="Book">Book</option>
          <option value="Electronics">Electronics</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700">Contact Info (Phone/Email)</label>
        <input type="text" id="itemContact" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
      </div>
      <button type="submit" class="w-full bg-indigo-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-indigo-700 transition">
        List Item
      </button>
    </form>

    <hr class="mb-6">

    <!-- Live Listings Section -->
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Available Listings (Live Sync)</h2>
    <div id="listingsContainer" class="space-y-3">
      <p class="text-gray-500 text-center">Loading items from cloud...</p>
    </div>
  </div>

  <script>
    // 2. Aapka Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAqgRTNJVl-uBblhCN-aHwWZgxoiM4HIKY",
      authDomain: "cu-sharehub-b081d.firebaseapp.com",
      databaseURL: "https://cu-sharehub-b081d-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "cu-sharehub-b081d",
      storageBucket: "cu-sharehub-b081d.firebasestorage.app",
      messagingSenderId: "431828686017",
      appId: "1:431828686017:web:804dcfae718c491b29b040"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 3. Form Submit hone par Firebase mein data save karna
    const itemForm = document.getElementById('itemForm');
    itemForm.addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('itemName').value;
      const category = document.getElementById('itemCategory').value;
      const contact = document.getElementById('itemContact').value;

      // Database ke 'listings' node mein push karein
      db.ref('listings').push({
        name: name,
        category: category,
        contact: contact,
        timestamp: Date.now()
      }).then(() => {
        alert('Item successfully listed across all devices!');
        itemForm.reset();
      }).catch((error) => {
        alert('Error: ' + error.message);
      });
    });

    // 4. Real-time data fetch karna (Dusre devices par turant dikhega)
    const listingsContainer = document.getElementById('listingsContainer');
    db.ref('listings').on('value', (snapshot) => {
      const data = snapshot.val();
      listingsContainer.innerHTML = '';

      if (data) {
        Object.keys(data).forEach(key => {
          const item = data[key];
          listingsContainer.innerHTML += `
            <div class="p-4 border rounded-lg shadow-sm bg-gray-50 flex justify-between items-center">
              <div>
                <h3 class="font-bold text-lg text-indigo-700">${item.name}</h3>
                <span class="text-xs bg-indigo-100 text-indigo-800 px-2 py-0.5 rounded font-semibold">${item.category}</span>
                <p class="text-sm text-gray-600 mt-1">Contact: <strong>${item.contact}</strong></p>
              </div>
            </div>
          `;
        });
      } else {
        listingsContainer.innerHTML = '<p class="text-gray-500 text-center">No items listed yet. Be the first one!</p>';
      }
    });
  </script>
</body>
</html>
